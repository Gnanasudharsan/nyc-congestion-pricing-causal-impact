# Trip-level TLC parquet files (profiled remotely with DuckDB, one file per month).
tlc:
  base_url: https://d37ci6vzurychx.cloudfront.net/trip-data
  services:
    yellow: {pickup_column: tpep_pickup_datetime}
    green: {pickup_column: lpep_pickup_datetime}
    fhvhv: {pickup_column: pickup_datetime}
  first_month: "2023-01"
  probe_months: ["2023-01", "2024-12", "2025-01", "2026-09"]
  role: outcome
  domain_area: traffic

# EPA AQS pre-generated hourly files (no API key needed).
epa_aqs:
  base_url: https://aqs.epa.gov/aqsweb/airdata
  parameters:
    "88101": PM2.5 FRM/FEM mass
    "42602": NO2
  years: [2023, 2024, 2025, 2026]
  role: outcome
  domain_area: air

# NYC Health Department real-time PM2.5 network (corrected DustTrak sensors).
nyccas:
  repo: https://github.com/nychealth/nyccas-data
  years: [2022, 2023, 2024, 2025, 2026]
  role: outcome
  domain_area: air

citibike:
  bucket_url: https://s3.amazonaws.com/tripdata/
  role: outcome
  domain_area: mobility

open_meteo:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  latitude: 40.7812   # Central Park
  longitude: -73.9665
  role: covariate
  domain_area: controls
