# Registry of every candidate dataset. One entry per source table.
# `python -m cordon.ingest.audit` profiles each entry (coverage, rows, category levels)
# and writes data/catalog/profiles.json. Roles are proposals reviewed in docs/data-catalog.md.
#
# kind: socrata | tlc | epa_aqs | citibike | open_meteo
# role: outcome | covariate | geography | descriptive_only

socrata:
  # ---------------------------------------------------------------- traffic
  - key: bt_hourly_crossings
    title: MTA Bridges and Tunnels Hourly Crossings (Beginning 2019)
    domain: data.ny.gov
    id: ebfx-2m7v
    date_column: date
    group_columns: [facility, vehicle_class_category, payment_method]
    role: outcome
    domain_area: traffic
  - key: bt_hourly_reconciled
    title: MTA Bridges & Tunnels Hourly Reconciled Crossings (2019-2024)
    domain: data.ny.gov
    id: rtih-nq26
    date_column: date
    group_columns: [facility]
    role: outcome
    domain_area: traffic
  - key: cbd_vmt
    title: MTA Vehicle Miles Traveled in the CBD (Beginning 2024)
    domain: data.ny.gov
    id: jbxx-kxff
    date_column: date
    group_columns: [area]
    role: outcome
    domain_area: traffic
  - key: cbd_taxi_fhv_trips
    title: MTA CBD Taxi and For-Hire Vehicle Trips (Beginning May 2019)
    domain: data.ny.gov
    id: d3qp-nhf8
    date_column: month
    group_columns: [service_type, cbd_relation, time_period]
    role: outcome
    domain_area: traffic
  - key: cbd_taxi_fhv_speeds
    title: MTA CBD Taxi and For-Hire Vehicle Speeds (Beginning October 2019)
    domain: data.ny.gov
    id: 6p29-6xqn
    date_column: month
    group_columns: [zone]
    role: outcome
    domain_area: traffic
  - key: crz_entries
    title: MTA Congestion Relief Zone Vehicle Entries (Beginning 2025)
    domain: data.ny.gov
    id: t6yz-b64h
    date_column: toll_date
    group_columns: [detection_group, vehicle_class]
    role: descriptive_only
    domain_area: traffic
  - key: dot_traffic_speeds
    title: NYC DOT Traffic Speeds (real-time sensor links)
    domain: data.cityofnewyork.us
    id: i4gi-tjb9
    date_column: data_as_of
    probe_dates: ["2019-01-01", "2022-01-11", "2023-01-10", "2024-01-09", "2024-11-12", "2025-01-07", "2025-06-10", "2026-01-13", "2026-11-03"]
    role: outcome
    domain_area: traffic
  - key: dot_atr_counts
    title: NYC DOT Automated Traffic Volume Counts
    domain: data.cityofnewyork.us
    id: 7ym2-wayt
    date_column: yr
    group_columns: [boro]
    role: outcome
    domain_area: traffic
  - key: tlc_zone_monthly
    title: TLC Pickups and Drop-offs by Taxi Zone and Industry (monthly)
    domain: data.cityofnewyork.us
    id: c5iv-bn4s
    date_column: metric_month
    group_columns: [industry]
    role: outcome
    domain_area: traffic

