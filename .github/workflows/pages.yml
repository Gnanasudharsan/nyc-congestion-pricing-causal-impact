name: Site

# Renders the Quarto site and PDF paper from committed sources and results/,
# then deploys to GitHub Pages. No analysis runs here: every number on the site
# is read from files generated by `make analysis` and committed.

on:
  push:
    branches: [main]
    paths: ["report/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Authenticated GitHub API calls for the TinyTeX release lookup
          # (unauthenticated calls are rate-limited and can fail with 403).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 1.11.9
          tinytex: true
      - name: Render site and PDF
        run: quarto render report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
