[project]
name = "cordon"
version = "0.1.0"
description = "Causal inference on NYC congestion pricing: difference-in-differences, synthetic control, and spillover analysis on public MTA, TLC, and EPA data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gnanasudharsan Ashokumar" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=2.0.0",
    "linearmodels>=7.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
causal = [
    "causalpy>=0.9.0",
    "dowhy>=0.12",
    "pyfixest>=0.70.0",
    "pysyncon>=1.7.0",
    "wildboottest>=0.3.2",
]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cordon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D", "PTH", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cordon"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "statsmodels.*", "linearmodels.*", "causalpy.*", "pysyncon.*", "dowhy.*", "wildboottest.*", "altair.*", "plotly.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test requires internet access (skipped in CI by default)",
    "slow: long-running test",
]
